<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Europa 2026 · Fernando & Lucía</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --orange: #C8651B;
  --orange-l: #FDF3EA;
  --orange-m: #E8934A;
  --dark: #1A1208;
  --gray: #4A4035;
  --gray-l: #F5F2EE;
  --gray-ll: #FAF8F5;
  --blue: #1565C0;
  --blue-l: #E8F4FD;
  --green: #2E7D32;
  --green-l: #E8F5E9;
  --tip: #7A5500;
  --tip-bg: #FFFBF0;
  --voucher-bg: #FFF8F0;
  --r: 12px;
  --rs: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--gray-ll);
  color: var(--dark);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.hdr {
  background: linear-gradient(135deg, #C8651B 0%, #A04A0E 100%);
  color: #fff;
  padding: 1.25rem 1rem 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(160,74,14,.35);
}
.hdr-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: .6rem; }
.hdr-title { font-family: 'DM Serif Display', serif; font-size: 22px; letter-spacing: -.3px; line-height: 1.1; }
.hdr-sub { font-size: 11px; opacity: .8; margin-top: 2px; }
.hdr-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: .65rem; }
.chip { background: rgba(255,255,255,.18); border-radius: 20px; padding: 2px 9px; font-size: 10px; font-weight: 500; }

/* ── NAV TABS (main) ── */
.main-tabs { display: flex; border-top: 1px solid rgba(255,255,255,.2); }
.main-tab {
  flex: 1; text-align: center; padding: .55rem .25rem;
  font-size: 11px; font-weight: 500; color: rgba(255,255,255,.65);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .2s;
}
.main-tab.active { color: #fff; border-bottom-color: #fff; }

/* ── DAY NAV ── */
.day-nav-wrap { background: #fff; border-bottom: 1px solid #EDE9E3; position: sticky; top: 130px; z-index: 90; }
.day-nav { display: flex; gap: 4px; overflow-x: auto; padding: .5rem .75rem; scrollbar-width: none; }
.day-nav::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0; border: 1px solid #DDD8D0; border-radius: var(--rs);
  padding: 5px 9px; background: #fff; cursor: pointer; text-align: center; min-width: 46px;
  transition: all .15s;
}
.day-btn.active { background: var(--orange); border-color: var(--orange); }
.day-btn.today:not(.active) { border-color: var(--orange); }
.day-btn.today:not(.active) .dnum { color: var(--orange); }
.dnum { font-size: 12px; font-weight: 600; color: var(--dark); display: block; }
.dday { font-size: 9px; color: #888; display: block; }
.day-btn.active .dnum, .day-btn.active .dday { color: #fff; }

/* ── MAIN CONTENT ── */
.page { display: none; padding: .75rem .85rem 5rem; }
.page.visible { display: block; }

/* ── CARDS ── */
.card {
  background: #fff; border-radius: var(--r);
  border: 1px solid #EDE9E3; margin-bottom: .65rem;
  overflow: hidden;
}
.card-hdr {
  background: linear-gradient(135deg, var(--orange) 0%, #A04A0E 100%);
  padding: .7rem 1rem; display: flex; align-items: center; justify-content: space-between;
}
.card-hdr-title { font-size: 13px; font-weight: 600; color: #fff; }
.card-hdr-sub { font-size: 10px; color: rgba(255,255,255,.8); }
.card-body { padding: .85rem 1rem; }

/* ── HOTEL ROW ── */
.hotel-row {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--gray-l); border-radius: var(--rs);
  padding: 8px 10px; margin-bottom: .5rem;
}
.hotel-icon { font-size: 18px; flex-shrink: 0; padding-top: 1px; }
.hotel-info { flex: 1; }
.hotel-name { font-size: 12px; font-weight: 600; color: var(--dark); line-height: 1.3; }
.hotel-code { font-size: 10px; color: #888; margin-top: 1px; }
.hotel-bk { font-size: 10px; font-weight: 500; }
.hotel-bk.yes { color: var(--green); }
.hotel-bk.no { color: #888; }
.btn-ticket {
  background: var(--orange); color: #fff; border: none;
  border-radius: 6px; padding: 4px 9px; font-size: 10px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  font-family: 'DM Sans', sans-serif;
}
.btn-ticket.blue { background: var(--blue); }
.btn-ticket.green { background: var(--green); }
.btn-ticket.dark { background: var(--dark); }

/* ── TIMELINE ── */
.sec-label {
  font-size: 9px; font-weight: 700; color: var(--orange);
  letter-spacing: .8px; text-transform: uppercase;
  margin: .75rem 0 .35rem;
}
.tl { display: flex; flex-direction: column; }
.ti { display: flex; gap: 8px; padding: 3px 0; align-items: flex-start; }
.ti-time { font-size: 10px; color: var(--orange); font-weight: 600; min-width: 38px; padding-top: 2px; flex-shrink: 0; }
.ti-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); margin-top: 5px; flex-shrink: 0; }
.ti-text { font-size: 12px; color: var(--dark); line-height: 1.5; }
.ti-sub { font-size: 10px; color: #888; display: block; margin-top: 1px; }
.ti-sub a { color: var(--blue); text-decoration: none; }

/* ── TRANSPORT ── */
.tr-row {
  background: var(--gray-l); border-radius: var(--rs);
  padding: 7px 10px; margin: 3px 0; font-size: 11.5px;
  color: var(--dark); line-height: 1.5;
  display: flex; align-items: flex-start; gap: 7px;
}
.tr-icon { flex-shrink: 0; font-size: 16px; padding-top: 1px; }

/* ── NIGHTJET ── */
.nightjet-row {
  background: var(--blue-l); border-left: 3px solid var(--blue);
  border-radius: 0 var(--rs) var(--rs) 0; padding: 8px 10px; margin-bottom: .5rem;
  display: flex; align-items: flex-start; gap: 8px;
}
.nj-title { font-size: 12px; font-weight: 700; color: var(--blue); }
.nj-sub { font-size: 10px; color: #555; margin-top: 1px; }

/* ── VOUCHER ── */
.voucher {
  border: 1.5px dashed var(--orange); border-radius: var(--rs);
  background: var(--voucher-bg); padding: 9px 11px; margin: .4rem 0;
}
.v-title { font-size: 12px; font-weight: 700; color: var(--orange); margin-bottom: 4px; }
.v-body { font-size: 11px; color: var(--dark); line-height: 1.6; }
.v-warn { font-size: 10.5px; color: #C00; font-weight: 600; margin-top: 4px; }

/* ── APPS ── */
.apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: .3rem 0; }
.app-card { background: #F0F4FF; border-radius: var(--rs); padding: 7px 9px; }
.app-name { font-size: 11.5px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
.app-det { font-size: 10px; color: #666; line-height: 1.4; }
.app-free { font-size: 10px; font-weight: 600; color: var(--green); margin-top: 3px; }
.app-nofree { font-size: 10px; color: #888; margin-top: 3px; }

/* ── TIPS ── */
.tip-row {
  background: var(--tip-bg); border-left: 2px solid #E8A030;
  border-radius: 0 var(--rs) var(--rs) 0;
  padding: 5px 9px; margin: 3px 0;
  font-size: 11.5px; color: var(--tip); line-height: 1.5;
}

/* ── SECTION TABS ── */
.stabs { display: flex; gap: 4px; margin: .5rem 0 .25rem; overflow-x: auto; scrollbar-width: none; }
.stabs::-webkit-scrollbar { display: none; }
.stab {
  flex-shrink: 0; font-size: 10px; padding: 3px 9px;
  border-radius: 20px; border: 1px solid #DDD8D0;
  background: #fff; cursor: pointer; color: #888;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
}
.stab.active { background: var(--orange); border-color: var(--orange); color: #fff; }

/* ── LINK BTN ── */
.link-btn {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; color: var(--blue); text-decoration: none;
  background: var(--blue-l); border-radius: 5px; padding: 2px 7px;
  margin: 2px 2px 2px 0;
}

/* ── NAV BTNS ── */
.nav-btns { display: flex; gap: 8px; margin-top: .5rem; }
.nav-btn {
  flex: 1; font-size: 12px; padding: 8px;
  border-radius: var(--rs); border: 1px solid #DDD8D0;
  background: #fff; cursor: pointer; color: var(--dark);
  font-family: 'DM Sans', sans-serif; font-weight: 500;
}
.nav-btn:disabled { opacity: .3; cursor: default; }

/* ── TODAY BANNER ── */
.today-banner {
  background: var(--orange); color: #fff; border-radius: var(--rs);
  padding: 5px 11px; margin-bottom: .5rem;
  font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px;
}

/* ── TICKETS PAGE ── */
.tickets-grid { display: flex; flex-direction: column; gap: .5rem; }
.tkt-card {
  background: #fff; border-radius: var(--r); border: 1px solid #EDE9E3;
  overflow: hidden;
}
.tkt-hdr {
  display: flex; align-items: center; gap: 10px;
  padding: .65rem 1rem; border-bottom: 1px solid #EDE9E3;
}
.tkt-icon { font-size: 22px; flex-shrink: 0; }
.tkt-title { font-size: 13px; font-weight: 600; color: var(--dark); }
.tkt-date { font-size: 10px; color: #888; margin-top: 1px; }
.tkt-body { padding: .7rem 1rem; }
.tkt-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 3px 0; border-bottom: .5px solid #F0EDE8; }
.tkt-row:last-child { border-bottom: none; }
.tkt-key { font-size: 10px; color: #888; flex-shrink: 0; width: 90px; }
.tkt-val { font-size: 11px; color: var(--dark); font-weight: 500; text-align: right; flex: 1; }
.tkt-code {
  background: var(--orange-l); border-radius: var(--rs);
  padding: 6px 10px; margin-top: .5rem;
  font-size: 12px; font-weight: 700; color: var(--orange);
  letter-spacing: .5px; text-align: center;
}
.tkt-warn {
  background: #FFF3CD; border-radius: var(--rs); padding: 6px 10px;
  margin-top: .4rem; font-size: 10.5px; color: #856404; line-height: 1.5;
}
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
}
.badge-hotel { background: #E3F2FD; color: #1565C0; }
.badge-train { background: #E8F5E9; color: #2E7D32; }
.badge-flight { background: #EDE7F6; color: #512DA8; }
.badge-voucher { background: var(--orange-l); color: var(--orange); }
.badge-car { background: #FFF3E0; color: #E65100; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 999; align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--r) var(--r) 0 0;
  width: 100%; max-height: 85vh; overflow-y: auto;
  animation: slideUp .25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-hdr {
  background: linear-gradient(135deg, var(--orange) 0%, #A04A0E 100%);
  padding: .85rem 1rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
}
.modal-title { font-size: 14px; font-weight: 700; color: #fff; }
.modal-close {
  background: rgba(255,255,255,.25); border: none; color: #fff;
  border-radius: 50%; width: 28px; height: 28px; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
}
.modal-body { padding: 1rem; }
.modal-section { margin-bottom: 1rem; }
.modal-section-title { font-size: 10px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: .8px; margin-bottom: .4rem; }
.modal-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: .5px solid #F0EDE8; }
.modal-row:last-child { border-bottom: none; }
.modal-key { font-size: 11px; color: #888; }
.modal-val { font-size: 11px; color: var(--dark); font-weight: 500; text-align: right; max-width: 60%; }
.modal-code {
  background: var(--orange-l); border-radius: var(--rs); padding: 8px 12px;
  font-size: 13px; font-weight: 700; color: var(--orange); text-align: center;
  letter-spacing: 1px; margin: .5rem 0;
}
.modal-warn {
  background: #FFF3CD; border-left: 3px solid #F59E0B;
  border-radius: 0 var(--rs) var(--rs) 0;
  padding: 8px 10px; font-size: 11px; color: #856404;
  line-height: 1.6; margin: .4rem 0;
}
.modal-info {
  background: var(--blue-l); border-radius: var(--rs);
  padding: 8px 10px; font-size: 11px; color: #1565C0;
  line-height: 1.6; margin: .4rem 0;
}

/* ── SCROLL TOP ── */
.fab {
  position: fixed; bottom: 1.2rem; right: 1rem; z-index: 200;
  background: var(--orange); color: #fff; border: none;
  border-radius: 50%; width: 42px; height: 42px; font-size: 18px;
  box-shadow: 0 4px 12px rgba(200,101,27,.4);
  cursor: pointer; display: none; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
}
.fab.show { display: flex; }
</style>

// ═══════════════════════════════════════════
// PAGE LOGIC
// ═══════════════════════════════════════════

let currentDay = 0;
let activeTab = {};

function getTodayIdx() {
  const t = new Date().toISOString().split('T')[0];
  let f = DAYS.findIndex(d => d.date === t);
  if (f >= 0) return f;
  let fu = DAYS.findIndex(d => d.date > t);
  return fu >= 0 ? fu : 0;
}

function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('visible');
  el.classList.add('active');
  document.getElementById('dayNavWrap').style.display = id === 'itinerario' ? 'block' : 'none';
  if (id === 'tickets') buildTicketsPage();
  if (id === 'vuelos') buildVuelosPage();
  if (id === 'info') buildInfoPage();
  window.scrollTo(0, 0);
}

// ── ITINERARIO ──
function initDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const ti = getTodayIdx();
  DAYS.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'day-btn' + (i === currentDay ? ' active' : '') + (i === ti ? ' today' : '');
    const parts = d.label.split(' ');
    b.innerHTML = `<span class="dnum">${parts[1]}</span><span class="dday">${parts[0]}</span>`;
    b.onclick = () => { currentDay = i; initDayNav(); renderDay(); };
    nav.appendChild(b);
  });
  setTimeout(() => {
    const el = nav.children[currentDay];
    if (el) el.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function renderDay() {
  const d = DAYS[currentDay];
  const ti = getTodayIdx();
  const banner = document.getElementById('todayBanner');
  banner.innerHTML = currentDay === ti
    ? `<div class="today-banner">📍 Hoy estás en: ${d.city}</div>` : '';

  if (!activeTab[currentDay]) activeTab[currentDay] = d.tabs[0];
  const at = activeTab[currentDay];

  let h = `<div class="card">`;
  h += `<div class="card-hdr"><div><div class="card-hdr-title">${d.label}</div><div class="card-hdr-sub">${d.city}</div></div></div>`;
  h += `<div class="card-body">`;

  // Hotel
  if (d.hotel) {
    const bkTxt = d.breakfast ? 'Desayuno incluido' : 'Sin desayuno';
    const bkCls = d.breakfast ? 'yes' : 'no';
    h += `<div class="hotel-row">
      <div class="hotel-icon">🏨</div>
      <div class="hotel-info">
        <div class="hotel-name">${d.hotel}</div>
        <div class="hotel-bk ${bkCls}">${bkTxt}</div>
      </div>
      ${d.hotelKey ? `<button class="btn-ticket" onclick="openModal('hotel','${d.hotelKey}')">Reserva</button>` : ''}
    </div>`;
  }

  // Nightjet
  if (d.nightjet) {
    h += `<div class="nightjet-row">
      <div style="font-size:22px">🌙</div>
      <div class="hotel-info">
        <div class="nj-title">Nightjet NJ 421 — Tren nocturno</div>
        <div class="nj-sub">Amsterdam → Munich · Mini Cabin · Incluye desayuno</div>
      </div>
      <button class="btn-ticket blue" onclick="openModal('ticket','nightjet')">Ticket</button>
    </div>`;
  }

  // Train ticket button
  if (d.trainKey && !d.nightjet) {
    const tkMap = {
      ecmunven: { label: 'EC 81 Ticket', key: 'ecmunven', color: '' },
      auto: { label: 'Voucher Auto', key: 'auto', color: 'green' },
      rijksmuseum: { label: 'Rijksmuseum', key: 'rijksmuseum', color: '' },
      accademia: { label: 'Voucher Accademia', key: 'accademia', color: '' },
      vaticano: { label: 'Voucher Vaticano', key: 'vaticano', color: '' },
    };
    const tk = tkMap[d.trainKey];
    if (tk) {
      h += `<div style="margin-bottom:.4rem">
        <button class="btn-ticket ${tk.color}" onclick="openModal('ticket','${tk.key}')">🎫 ${tk.label}</button>
      </div>`;
    }
  }

  // Section tabs
  const tabLabels = { programa: 'Programa', transport: 'Transporte', bici: 'Bici', vespa: 'Vespa', tips: 'Tips' };
  const availTabs = d.tabs.filter(t => {
    if (t === 'bici' && (!d.bici || !d.bici.length)) return false;
    if (t === 'vespa' && (!d.vespa || !d.vespa.length)) return false;
    if (t === 'transport' && (!d.transport || !d.transport.length)) return false;
    if (t === 'vuelo') return false;
    return true;
  });

  h += `<div class="stabs">`;
  availTabs.forEach(t => {
    h += `<button class="stab${at === t ? ' active' : ''}" onclick="switchTab('${t}')">${tabLabels[t]}</button>`;
  });
  h += `</div>`;

  // Tab: Programa
  h += `<div id="tp-programa" style="${at === 'programa' ? '' : 'display:none'}">`;
  h += `<div class="tl">`;
  (d.programa || []).forEach(it => {
    let sub = it.sub || '';
    sub = sub.replace(/(maps\.app\.goo\.gl\/\S+)/g, (m) =>
      `<a class="link-btn" href="https://${m}" target="_blank">🗺 Ruta</a>`
    );
    h += `<div class="ti"><div class="ti-time">${it.time || ''}</div><div class="ti-dot"></div><div class="ti-text">${it.text}${sub ? `<span class="ti-sub">${sub}</span>` : ''}</div></div>`;
  });
  h += `</div>`;
  if (d.links && d.links.length) {
    h += `<div style="margin-top:.5rem">`;
    d.links.forEach(l => {
      h += `<a class="link-btn" href="${l.url}" target="_blank">🗺 ${l.text}</a>`;
    });
    h += `</div>`;
  }
  h += `</div>`;

  // Tab: Transporte
  h += `<div id="tp-transport" style="${at === 'transport' ? '' : 'display:none'}">`;
  (d.transport || []).forEach(t => {
    h += `<div class="tr-row"><div class="tr-icon">🚌</div><div>${t}</div></div>`;
  });
  h += `</div>`;

  // Tab: Bici
  h += `<div id="tp-bici" style="${at === 'bici' ? '' : 'display:none'}">`;
  if (d.bici && d.bici.length) {
    h += `<div class="apps-grid">`;
    d.bici.forEach(a => {
      h += `<div class="app-card"><div class="app-name">🚲 ${a.name}</div><div class="app-det">${a.det}</div><div class="app-free">${a.free}</div></div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;

  // Tab: Vespa
  h += `<div id="tp-vespa" style="${at === 'vespa' ? '' : 'display:none'}">`;
  if (d.vespa && d.vespa.length) {
    h += `<div class="apps-grid">`;
    d.vespa.forEach(a => {
      h += `<div class="app-card"><div class="app-name">🛵 ${a.name}</div><div class="app-det">${a.det}</div><div class="app-free">${a.free}</div></div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;

  // Tab: Tips
  h += `<div id="tp-tips" style="${at === 'tips' ? '' : 'display:none'}">`;
  (d.tips || []).forEach(t => {
    h += `<div class="tip-row">💡 ${t}</div>`;
  });
  h += `</div>`;

  h += `</div></div>`;

  // Nav buttons
  h += `<div class="nav-btns">
    <button class="nav-btn" onclick="changeDay(-1)" ${currentDay === 0 ? 'disabled' : ''}>← Anterior</button>
    <button class="nav-btn" onclick="changeDay(1)" ${currentDay === DAYS.length - 1 ? 'disabled' : ''}>Siguiente →</button>
  </div>`;

  document.getElementById('dayContent').innerHTML = h;
}

function switchTab(t) {
  activeTab[currentDay] = t;
  renderDay();
  document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function changeDay(dir) {
  currentDay = Math.max(0, Math.min(DAYS.length - 1, currentDay + dir));
  initDayNav();
  renderDay();
  document.getElementById('todayBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── MODAL ──
function openModal(type, key) {
  let data, title, body = '';

  if (type === 'hotel') {
    data = HOTELS[key];
    if (!data) return;
    title = data.title;
    body += `<div class="modal-section">`;
    body += `<div class="modal-section-title">Detalles de la reserva</div>`;
    Object.entries(data.data).forEach(([k, v]) => {
      body += `<div class="modal-row"><div class="modal-key">${k}</div><div class="modal-val">${v}</div></div>`;
    });
    body += `</div>`;
    if (data.warn) body += `<div class="modal-warn">⚠ ${data.warn}</div>`;
    body += `<div class="modal-info">📞 Emergencias Levys Tours: +54 9 11 6700 2000</div>`;
  } else {
    data = TICKETS[key];
    if (!data) return;
    title = data.title;

    if (data.data) {
      body += `<div class="modal-section">`;
      body += `<div class="modal-section-title">Detalles</div>`;
      Object.entries(data.data).forEach(([k, v]) => {
        body += `<div class="modal-row"><div class="modal-key">${k}</div><div class="modal-val">${v}</div></div>`;
      });
      body += `</div>`;
    }

    if (data.segments) {
      body += `<div class="modal-section">`;
      body += `<div class="modal-section-title">Tramos del vuelo</div>`;
      data.segments.forEach(s => {
        body += `<div style="background:var(--gray-l);border-radius:var(--rs);padding:8px 10px;margin-bottom:5px">
          <div style="font-size:11px;font-weight:700;color:var(--orange)">${s.vuelo}</div>
          <div style="font-size:11px;margin-top:2px"><b>${s.from}</b> → <b>${s.to}</b></div>
          <div style="font-size:10px;color:#666;margin-top:2px">${s.salida} → ${s.arribo}</div>
          <div style="font-size:10px;color:#888">${s.terminal}</div>
        </div>`;
      });
      body += `</div>`;
    }

    if (data.warn) body += `<div class="modal-warn">⚠ ${data.warn}</div>`;
    if (data.info) body += `<div class="modal-info">ℹ ${data.info}</div>`;
  }

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
}
